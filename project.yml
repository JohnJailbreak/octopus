# XcodeGen specification. CI runs `xcodegen generate`; the .xcodeproj is not committed.
name: Octopus
options:
  bundleIdPrefix: com.parv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/Octopus # module.modulemap exposes the C core as OctopusCore
    GCC_C_LANGUAGE_STANDARD: gnu11
targets:
  OctopusCore:
    type: library.static
    platform: iOS
    sources:
      - path: Octopus/Core
      - path: Octopus/Protocol
    settings:
      base:
        PRODUCT_NAME: OctopusCore
        SKIP_INSTALL: YES
  Octopus:
    type: application
    platform: iOS
    sources:
      - path: Octopus/App
      - path: Octopus/Resources
    dependencies:
      - target: OctopusCore
    info:
      path: Octopus/Info.plist
      properties:
        CFBundleDisplayName: Octopus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - Fonarto-Regular.ttf
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parv.octopus
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OctopusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Octopus/Tests/AppTests
    dependencies:
      - target: Octopus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.parv.octopus.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Octopus:
    build:
      targets:
        Octopus: all
        OctopusTests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - OctopusTests
